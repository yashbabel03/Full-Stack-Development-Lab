<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>React Calculator App</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
body { background: #f0f2f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
.app-header { width: 100%; max-width: 400px; margin-bottom: 20px; }
.app-header h1 { font-size: 22px; font-weight: 700; color: #282c34; }
.app-header p { font-size: 12px; color: #888; margin-top: 2px; }
.calculator { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); width: 100%; max-width: 400px; overflow: hidden; }
.display { background: #282c34; padding: 20px 20px 12px; text-align: right; }
.display .expression { font-size: 14px; color: #888; min-height: 20px; margin-bottom: 4px; word-break: break-all; }
.display .current { font-size: 40px; color: #fff; font-weight: 300; word-break: break-all; min-height: 52px; }
.buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: #e0e0e0; }
button { padding: 20px; font-size: 18px; border: none; cursor: pointer; transition: background 0.1s; font-weight: 500; }
button:active { opacity: 0.8; transform: scale(0.97); }
.btn-number { background: #fff; color: #282c34; }
.btn-number:hover { background: #f5f5f5; }
.btn-operator { background: #f0f0f0; color: #e67e22; }
.btn-operator:hover { background: #e8e8e8; }
.btn-equals { background: #00b894; color: #fff; }
.btn-equals:hover { background: #00a381; }
.btn-clear { background: #e74c3c; color: #fff; }
.btn-clear:hover { background: #c0392b; }
.btn-special { background: #f0f0f0; color: #555; }
.btn-special:hover { background: #e8e8e8; }
.btn-zero { grid-column: span 2; }
.component-tag { background: #e8f4fd; border: 1px solid #bee3f8; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #2b6cb0; margin-bottom: 6px; display: inline-block; }
</style>
</head>
<body>

<div class="app-header">
  <span class="component-tag">&lt;App /&gt; → &lt;Calculator /&gt;</span>
  <h1>React Calculator</h1>
  <p>MIT-WPU · FSD Lab 05 · Interactive UI using React</p>
</div>

<div class="calculator" id="calc">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="buttons">
    <button class="btn-clear" onclick="clearAll()">AC</button>
    <button class="btn-special" onclick="toggleSign()">+/-</button>
    <button class="btn-special" onclick="percentage()">%</button>
    <button class="btn-operator" onclick="setOperator('/')">÷</button>

    <button class="btn-number" onclick="appendNumber('7')">7</button>
    <button class="btn-number" onclick="appendNumber('8')">8</button>
    <button class="btn-number" onclick="appendNumber('9')">9</button>
    <button class="btn-operator" onclick="setOperator('*')">×</button>

    <button class="btn-number" onclick="appendNumber('4')">4</button>
    <button class="btn-number" onclick="appendNumber('5')">5</button>
    <button class="btn-number" onclick="appendNumber('6')">6</button>
    <button class="btn-operator" onclick="setOperator('-')">−</button>

    <button class="btn-number" onclick="appendNumber('1')">1</button>
    <button class="btn-number" onclick="appendNumber('2')">2</button>
    <button class="btn-number" onclick="appendNumber('3')">3</button>
    <button class="btn-operator" onclick="setOperator('+')">+</button>

    <button class="btn-number btn-zero" onclick="appendNumber('0')">0</button>
    <button class="btn-number" onclick="appendDecimal()">.</button>
    <button class="btn-equals" onclick="calculate()">=</button>
  </div>
</div>

<script>
let current = '0';
let previous = '';
let operator = null;
let shouldReset = false;

function updateDisplay() {
  document.getElementById('current').textContent = current;
}

function updateExpression(text) {
  document.getElementById('expression').textContent = text;
}

function appendNumber(num) {
  if (shouldReset) { current = num; shouldReset = false; }
  else current = current === '0' ? num : current + num;
  updateDisplay();
}

function appendDecimal() {
  if (shouldReset) { current = '0.'; shouldReset = false; updateDisplay(); return; }
  if (!current.includes('.')) { current += '.'; updateDisplay(); }
}

function setOperator(op) {
  if (operator && !shouldReset) calculate(true);
  previous = current;
  operator = op;
  shouldReset = true;
  const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  updateExpression(previous + ' ' + symbols[op]);
}

function calculate(chaining) {
  if (!operator || !previous) return;
  const a = parseFloat(previous);
  const b = parseFloat(current);
  let result;
  if (operator === '+') result = a + b;
  else if (operator === '-') result = a - b;
  else if (operator === '*') result = a * b;
  else if (operator === '/') result = b === 0 ? 'Error' : a / b;
  const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  if (!chaining) updateExpression(previous + ' ' + symbols[operator] + ' ' + current + ' =');
  current = result === 'Error' ? 'Error' : parseFloat(result.toFixed(10)).toString();
  operator = null;
  shouldReset = true;
  updateDisplay();
}

function clearAll() {
  current = '0'; previous = ''; operator = null; shouldReset = false;
  updateDisplay(); updateExpression('');
}

function toggleSign() {
  current = (parseFloat(current) * -1).toString();
  updateDisplay();
}

function percentage() {
  current = (parseFloat(current) / 100).toString();
  updateDisplay();
}
</script>
</body>
</html>
